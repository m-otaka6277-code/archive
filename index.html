<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ec">
  <title>アーカイブサイト</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f2ec;
      --ink: #20211e;
      --muted: #85847d;
      --line: #d8d6ce;
      --serif: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    .page { width: min(100% - 72px, 1440px); margin: 0 auto; }
    header {
      min-height: 188px;
      padding: 42px 0 30px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      gap: 24px;
    }
    .eyebrow {
      margin: 0 0 13px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(32px, 5vw, 58px);
      line-height: 1.1;
      font-weight: 400;
      letter-spacing: .06em;
    }
    .count {
      padding-bottom: 5px;
      color: var(--muted);
      font-family: var(--serif);
      font-size: 14px;
      letter-spacing: .08em;
      white-space: nowrap;
    }
    main { padding: 34px 0 74px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 42px 24px;
    }
    .entry { min-width: 0; }
    .photo-button {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      height: clamp(260px, 31vw, 450px);
      overflow: hidden;
      padding: 0;
      border: 0;
      background: #e9e7e0;
      cursor: zoom-in;
    }
    .photo-button img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 500ms cubic-bezier(.2,.7,.2,1);
    }
    .photo-button:hover img { transform: scale(1.025); }
    .photo-button:focus-visible, .close:focus-visible {
      outline: 2px solid #69685f;
      outline-offset: 4px;
    }
    .caption {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin-top: 13px;
      font-family: var(--serif);
      font-size: 15px;
      letter-spacing: .04em;
    }
    .number { color: var(--muted); font-size: 11px; letter-spacing: .12em; }
    .name { margin: 0; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 9px 0 0 25px; }
    .tag {
      display: inline-block;
      padding: 4px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #5d5c55;
      font-family: var(--sans);
      font-size: 11px;
      letter-spacing: .03em;
    }
    dialog {
      width: 100vw;
      height: 100dvh;
      max-width: none;
      max-height: none;
      margin: 0;
      padding: 28px;
      border: 0;
      background: rgba(22, 23, 21, .96);
      color: #f4f2ec;
    }
    dialog::backdrop { background: rgba(22, 23, 21, .96); }
    .lightbox-inner { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
    .lightbox-top { display: flex; justify-content: flex-end; }
    .close {
      border: 0;
      padding: 8px 2px 12px 16px;
      color: inherit;
      background: transparent;
      font: inherit;
      font-size: 13px;
      letter-spacing: .12em;
      cursor: pointer;
    }
    .lightbox-image { min-height: 0; display: grid; place-items: center; }
    .lightbox-image img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
    .lightbox-caption { padding-top: 16px; text-align: center; font-family: var(--serif); letter-spacing: .06em; }
    @media (max-width: 900px) {
      .page { width: min(100% - 48px, 720px); }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 34px 18px; }
      .photo-button { height: clamp(240px, 48vw, 390px); }
    }
    @media (max-width: 560px) {
      .page { width: calc(100% - 36px); }
      header { min-height: 148px; padding: 30px 0 22px; }
      .eyebrow { margin-bottom: 9px; font-size: 9px; }
      .count { font-size: 12px; }
      main { padding-top: 20px; }
      .grid { grid-template-columns: 1fr; gap: 29px; }
      .photo-button { height: min(112vw, 470px); }
      .caption { margin-top: 10px; }
      dialog { padding: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <p class="eyebrow">PERSONAL ARCHIVE</p>
        <h1>アーカイブサイト</h1>
      </div>
      <div class="count" id="count" aria-label="収録数"></div>
    </header>
    <main>
      <section class="grid" id="grid" aria-label="写真の一覧"></section>
    </main>
  </div>
  <dialog id="viewer" aria-label="写真の拡大表示">
    <div class="lightbox-inner">
      <div class="lightbox-top"><button class="close" id="close" type="button" aria-label="閉じる">閉じる ×</button></div>
      <div class="lightbox-image"><img id="largeImage" alt=""></div>
      <div class="lightbox-caption" id="largeCaption"></div>
    </div>
  </dialog>
  <script>
    const photos = [
      { file: "01.jpg", tags: [] },
      { file: "02.jpg", tags: [] },
      { file: "03.jpg", tags: ["名前: たんと"] },
      { file: "04.jpg", tags: [] },
      { file: "05.jpg", tags: [] }
    ];
    const grid = document.querySelector("#grid");
    const viewer = document.querySelector("#viewer");
    const largeImage = document.querySelector("#largeImage");
    const largeCaption = document.querySelector("#largeCaption");

    document.querySelector("#count").textContent = String(photos.length).padStart(2, "0");
    photos.forEach((photo, index) => {
      const { file, tags } = photo;
      const label = String(index + 1).padStart(2, "0");
      const entry = document.createElement("article");
      entry.className = "entry";
      entry.innerHTML = `
        <button class="photo-button" type="button" aria-label="写真 ${label} を拡大">
          <img src="images/${file}" alt="写真 ${label}" loading="lazy">
        </button>
        <div class="caption"><span class="number">${label}</span><p class="name">(ここに言葉)</p></div>
        ${tags.length ? `<div class="tags" aria-label="タグ">${tags.map(tag => `<span class="tag">${tag}</span>`).join("")}</div>` : ""}
      `;
      entry.querySelector("button").addEventListener("click", () => {
        largeImage.src = `images/${file}`;
        largeImage.alt = `写真 ${label}`;
        largeCaption.textContent = tags.length ? tags.join(" · ") : `(ここに言葉)`;
        viewer.showModal();
      });
      grid.append(entry);
    });
    document.querySelector("#close").addEventListener("click", () => viewer.close());
    viewer.addEventListener("click", event => { if (event.target === viewer) viewer.close(); });
    viewer.addEventListener("close", () => { largeImage.removeAttribute("src"); });
  </script>
</body>
</html>
